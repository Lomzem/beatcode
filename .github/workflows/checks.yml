name: Checks
on:
  pull_request:
  workflow_call:
    secrets:
      CONVEX_CI_DEPLOY_KEY:
        required: true
      CLERK_CI_SECRET_KEY:
        required: true
    outputs:
      authenticated-result:
        description: Required trusted authenticated CI result
        value: ${{ jobs.authenticated.result }}
permissions: {}
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bunx --no-install wrangler deploy --dry-run
      - run: bun run test:backend
      - run: bun run test:judge
      - run: bun run test:ops
      - run: bun run test:calibration
      - run: bun run test:frontend
      - run: bun test tests/e2e/required.test.ts
      - run: bunx --no-install vitest run --config tests/e2e/vitest.config.ts
  browser:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - run: bun run test:auth
      - run: bun run test:game-ui
      - run: bun run test:primitives
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  fork-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo 'Fork policy — public checks only. Authenticated CI requires a trusted same-repository branch; forks cannot deploy.'
  authenticated:
    if: github.repository == 'Lomzem/beatcode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    environment: ci
    permissions:
      contents: read
    # Shared backend: hold this lock across deploy, setup, all browsers and cleanup.
    concurrency:
      group: beatcode-authenticated-dev-ci
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - name: Deploy isolated CI app and require authenticated coverage
        run: bun tests/e2e/run.ts
        env:
          CONVEX_CI_DEPLOY_KEY: ${{ secrets.CONVEX_CI_DEPLOY_KEY }}
          CLERK_CI_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
          PUBLIC_CONVEX_URL: ${{ vars.CONVEX_CI_URL }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_DEV }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.CLERK_JWT_ISSUER_DOMAIN_DEV }}
          PUBLIC_CLERK_OAUTH_PROVIDERS: github,discord,google
      # Authenticated diagnostics/state are intentionally never uploaded.
  # Keep the required check name stable and fail closed for every applicable suite.
  checks:
    if: always()
    needs: [validate, browser, authenticated]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUTHENTICATED_RESULT: ${{ needs.authenticated.result }}
          AUTHENTICATED_REQUIRED: ${{ github.repository == 'Lomzem/beatcode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ "$VALIDATION_RESULT" = success ] && [ "$BROWSER_RESULT" = success ] &&
            { [ "$AUTHENTICATED_REQUIRED" = false ] ||
              { [ "$AUTHENTICATED_REQUIRED" = true ] && [ "$AUTHENTICATED_RESULT" = success ]; }; }; then
            exit 0
          fi
          echo '::error::Required validation, browser, or authenticated coverage did not succeed.'
          exit 1
