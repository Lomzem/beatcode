name: Clerk DNS
on:
  push:
    branches: [main]
    paths:
      - ops/dns.json
      - scripts/ops/dns-sync.mjs
      - .github/workflows/dns.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: clerk-dns
  cancel-in-progress: false
jobs:
  dns:
    if: github.repository == 'Lomzem/beatcode' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Validate explicit DNS manifest
        run: node scripts/ops/dns-sync.mjs ops/dns.json
      - name: Apply managed Clerk records
        run: node scripts/ops/dns-sync.mjs ops/dns.json --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
